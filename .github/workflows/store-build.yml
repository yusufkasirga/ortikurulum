name: Mağaza derlemesi
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android, ios ya da all"
        default: android
        required: true
      submit:
        description: "Derleme bitince mağazaya gönder (true/false)"
        default: "false"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Kontroller
        run: |
          npx tsc --noEmit
          npx expo lint
          npx jest --ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build
        run: |
          ARGS="--platform ${{ inputs.platform }} --profile production --non-interactive --no-wait"
          if [ "${{ inputs.submit }}" = "true" ]; then ARGS="$ARGS --auto-submit"; fi
          eas build $ARGS
